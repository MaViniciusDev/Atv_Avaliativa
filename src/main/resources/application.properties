# ----------------------------------------------------------------------------
# Configuracao da aplicacao Spring Boot
# ----------------------------------------------------------------------------

spring.application.name=steam-catalog

# Conexao com o MongoDB (sobrescreva com a variavel de ambiente MONGODB_URI/MONGODB_DB)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DB:steamcatalog}

# Cria automaticamente os indices declarados com @Indexed (inclui os unicos)
spring.data.mongodb.auto-index-creation=true

# Porta do servidor web (8080 costuma estar ocupada; usamos 8090).
# Sobrescreva com a variavel de ambiente SERVER_PORT.
server.port=${SERVER_PORT:8090}

# Log mais enxuto do driver
logging.level.org.mongodb.driver=warn
logging.level.org.springframework.data.mongodb=warn
